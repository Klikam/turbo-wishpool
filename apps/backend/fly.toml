# Deploy from the repo root:
#   fly deploy --config apps/backend/fly.toml --dockerfile apps/backend/Dockerfile
app = "wishpool-api"
primary_region = "ams"

[env]
NODE_ENV = "production"
PORT = "3001"
# Hop count of proxies in front of the backend; confirm with
# `pnpm --filter backend check:rate-limit` after the first deploy.
TRUST_PROXY = "1"
WEB_URL = "https://wishpool.gifts"

[http_service]
internal_port = 3001
force_https = true
auto_stop_machines = "off"
auto_start_machines = true
min_machines_running = 1

[[vm]]
size = "shared-cpu-1x"
memory = "512mb"
